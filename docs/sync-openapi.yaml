{
  "openapi": "3.2.1",
  "info": {
    "title": "Guild sync",
    "version": "1",
    "summary": "Shares finds and positions between the detectors of one guild.",
    "description": "Contract: docs/SYNC-PROTOCOL.md. Internal partner API for one guild: admin-issued keys, no browsers, no money. /v1 stays compatible; see \"Changing the contract\" there.",
    "x-format-note": "Written in JSON syntax, which is valid YAML, so the repository tests read it with the standard library."
  },
  "servers": [
    {
      "url": "https://158.69.179.64:8443",
      "description": "The guild server. The certificate is signed by the private CA shipped with the detector."
    }
  ],
  "security": [
    {
      "guildKey": []
    }
  ],
  "paths": {
