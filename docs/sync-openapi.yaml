          "500": {
            "$ref": "#/components/responses/ServerError"
          },
          "default": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "head": {
        "operationId": "listDatasetsHead",
        "summary": "The datasets this key may fetch (headers only)",
        "description": "For the client's daily check: the name, ETag and size of each served dataset, by name, a page at a time. Fetch a dataset only when its etag differs from the cached one. A query parameter other than limit and after gets 404 (a key never goes in a URL). Read only. The reply carries Cache-Control: no-store.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 100
            }
          },
          {
            "name": "after",
            "in": "query",
            "required": false,
            "description": "The `next` of the previous page; leave it out for the first page.",
            "schema": {
              "type": "string",
              "maxLength": 32,
              "pattern": "^[a-z0-9-]{0,32}$"
            }
          },
          {
            "$ref": "#/components/parameters/ClientVersion"
          }
        ],
        "x-rate-limit": {
          "limit": 30,
          "perSeconds": 60,
          "by": "key",
          "bucket": 30,
          "note": "The same per-key bucket as /v1/sync. Requests without a valid key count against the IP limit (10 a minute) instead."
        },
        "responses": {
          "200": {
            "description": "The same headers as GET. No body."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "405": {
            "$ref": "#/components/responses/MethodNotAllowed"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          },
          "default": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
