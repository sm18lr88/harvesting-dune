    "/v1/sync": {
      "post": {
        "operationId": "sync",
        "summary": "Upload finds, get the guild's",
        "description": "Upserts the caller's presence and records (each keyed by its 20 m cell; a retry changes nothing but the row's rev), then returns the battlegroup's presence and the partition's sightings after `since`. Safe to retry: no Idempotency-Key needed. Optional `objects` creates, replaces or deletes the caller's shared objects; the reply lists the battlegroup's objects after `since`.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ClientVersion"
          },
          {
            "$ref": "#/components/parameters/ContentEncoding"
          }
        ],
        "requestBody": {
          "required": true,
          "description": "At most 262144 bytes after any gzip is undone. Send Content-Encoding: gzip for bodies over 1 KiB.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SyncRequest"
              }
            }
          },
          "x-max-body-bytes": 262144
        },
        "responses": {
          "200": {
            "description": "Done.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SyncReply"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/CharacterOwned"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "405": {
            "$ref": "#/components/responses/MethodNotAllowed"
          },
          "413": {
            "$ref": "#/components/responses/TooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMedia"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          },
          "default": {
            "$ref": "#/components/responses/ServerError"
          }
        },
        "x-rate-limit": {
          "limit": 30,
          "perSeconds": 60,
          "by": "key",
          "bucket": 30,
          "note": "Requests without a valid key count against the IP limit (10 a minute) instead."
        }
      }
    },
