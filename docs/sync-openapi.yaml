    "/v1/data/{name}": {
      "get": {
        "operationId": "getDataset",
        "summary": "One dataset",
        "description": "The file's JSON as stored on the server, at most 4194304 bytes. Check at most once a day and on start; send If-None-Match with the cached ETag.",
        "parameters": [
          {
            "name": "name",
            "in": "path",
            "required": true,
            "description": "The dataset name. Anything else, including dots, slashes, backslashes and percent escapes, gets 404. The server never URL-decodes it.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 32,
              "pattern": "^[a-z0-9-]{1,32}$"
            }
          },
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "description": "The ETag of the cached copy (or a list of them, or *). A match gets 304 with no body.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Accept-Encoding",
            "in": "header",
            "required": false,
            "description": "With gzip, a body over 1 KiB comes gzipped (Content-Encoding: gzip).",
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/ClientVersion"
          }
        ],
        "x-rate-limit": {
          "limit": 30,
          "perSeconds": 60,
          "by": "key",
          "bucket": 30,
          "note": "The same per-key bucket as /v1/sync. Requests without a valid key count against the IP limit (10 a minute) instead."
        },
        "x-max-dataset-bytes": 4194304,
        "responses": {
          "200": {
            "description": "The dataset.",
            "headers": {
              "ETag": {
                "description": "Strong: the quoted sha256 hex of the uncompressed dataset bytes. The same for the gzip and the plain reply.",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[0-9a-f]{64}\"$"
                }
              },
              "Cache-Control": {
                "description": "Always `private`.",
                "schema": {
                  "type": "string",
                  "const": "private"
                }
              },
              "Vary": {
                "description": "Always `Accept-Encoding`.",
                "schema": {
                  "type": "string",
                  "const": "Accept-Encoding"
                }
              },
              "Content-Encoding": {
                "description": "`gzip` when the client accepts it and the body is over 1 KiB.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "gzip"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Dataset"
                }
              }
            }
          },
          "304": {
            "description": "If-None-Match matched: the cached copy is current. No body.",
            "headers": {
              "ETag": {
                "description": "Strong: the quoted sha256 hex of the uncompressed dataset bytes. The same for the gzip and the plain reply.",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[0-9a-f]{64}\"$"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NoDataset"
          },
          "405": {
            "$ref": "#/components/responses/MethodNotAllowed"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          },
          "default": {
            "$ref": "#/components/responses/ServerError"
          }
        }
